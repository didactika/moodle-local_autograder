ns</text></g><!--link Checking to Settled--><g class="link" data-entity-1="ent0003" data-entity-2="ent0006" id="lnk10" data-source-line="117" data-link-type="dependency"><path d="M553.37,239.517 C591.21,250.287 658,269.297 658,269.297 C658,269.297 658,284.297 658,284.297 C658,284.297 648,433.297 648,433.297 C648,433.297 480.223,477.785 414.143,495.305" style="stroke:#475569;stroke-width:1;" fill="none" id="Checking-to-Settled"/><polygon points="409.31,496.587,419.035,498.147,414.143,495.305,416.984,490.414,409.31,496.587" fill="#475569" style="stroke:#475569;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="653.88" y="372.436" fill="#0F172A" font-size="12" textLength="318.861" font-family="IBM Plex Sans">System cancels it, for instance a teacher graded first</text></g><!--link Checking to Waiting--><g class="link" data-entity-1="ent0003" data-entity-2="ent0002" id="lnk11" data-source-line="118" data-link-type="dependency"><path d="M553.21,218.177 C575.67,207.387 605,193.297 605,193.297 C605,193.297 605,178.297 605,178.297 C605,178.297 580.177,166.372 557.717,155.582" style="stroke:#475569;stroke-width:1;" fill="none" id="Checking-to-Waiting"/><polygon points="553.21,153.417,559.59,160.92,557.717,155.582,563.055,153.709,553.21,153.417" fill="#475569" style="stroke:#475569;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="606" y="190.436" fill="#0F172A" font-size="12" textLength="306.732" font-family="IBM Plex Sans">System moves it, for instance an extension arrived</text></g><!--link Checking to Picking--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" id="lnk12" data-source-line="119" data-link-type="dependency"><path d="M502.55,240.147 C467.33,251.007 408,269.297 408,269.297 C408,269.297 401.854,282.606 395.034,297.396" style="stroke:#475569;stroke-width:1;" fill="none" id="Checking-to-Picking"/><polygon points="392.94,301.937,400.341,295.439,395.034,297.396,393.076,292.089,392.94,301.937" fill="#475569" style